[package]
name = "oft"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oft"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "oapp/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
oapp = { git = "https://github.com/LayerZero-Labs/LayerZero-v2.git", rev = "37a2235e825fff94bca1774ab30d6823b727cb18", package = "oapp-latest" }
utils = { git = "https://github.com/LayerZero-Labs/LayerZero-v2.git", rev = "37a2235e825fff94bca1774ab30d6823b727cb18", package = "utils-latest" }
solana-helper = "0.1.0"